<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Onboarding Process</title>
<style>
  * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f0fb;
    }

    .page-wrapper {
      max-width: 980px;
      margin: 40px auto;
      padding: 32px 40px 48px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 24px;
      margin: 0 0 24px;
      font-weight: 500;
    }

/* Position top-right */
.profile-wrapper {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}

.profile-container {
  text-align: center;
}

/* Profile circle */
.profile-photo-holder {
  width: 130px;
  height: 130px;
  position: relative;
}

.profile-photo {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 3px solid #4b3b9a;
  object-fit: cover;
  background: #e9e6ff;
}

/* Default user icon (center) */
.profile-icon-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  color: #7369d7;
  opacity: 0.7;
  pointer-events: none;
}

/* Pencil Edit Icon */
.edit-icon {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: #4b3b9a;
  color: white;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* Small Modern Buttons */
.profile-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 10px;
}

.btn-small {
  padding: 5px 12px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
}

.btn-small.save {
  background: #4b3b9a;
  color: white;
}

.btn-small.remove {
  background: #d3d3d3;
  color: black;
}

/* ALTERNATE STEPS BOX (CHEVRON STYLE WITH HOVER + ACTIVE + NUMBERS) */
.alt-steps {
  display: flex;
  gap: 22px;   /* SPACE BETWEEN EACH STEP BOX */
  margin-bottom: 20px;
  margin-top: 18px;
}

.alt-step {
  position: relative;
  background: #140b8a; /* main color */
  color: white;
  padding: 10px 36px 10px 28px;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  height: 38px;
  line-height: 18px;
  display: flex;
  align-items: center;
  cursor: pointer;
  transition: 0.2s ease-in-out;
}

/* STEP NUMBER */
.alt-step span.step-number {
  font-weight: bold;
  margin-right: 6px;
  color: #fff;
  opacity: 0.9;
}

/* Left cut */
.alt-step::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 0;
  width: 0;
  height: 0;
  border-top: 19px solid transparent;
  border-bottom: 19px solid transparent;
  border-right: 20px solid #140b8a;
}

/* Right arrow */
.alt-step::after {
  content: "";
  position: absolute;
  right: -20px;
  top: 0;
  width: 0;
  height: 0;
  border-top: 19px solid transparent;
  border-bottom: 19px solid transparent;
  border-left: 20px solid #140b8a;
}

/* HOVER */
.alt-step:hover {
  background: #1e0fb3;
}

.alt-step:hover::before {
  border-right-color: #1e0fb3;
}

.alt-step:hover::after {
  border-left-color: #1e0fb3;
}

/* ACTIVE STEP */
.alt-step.active {
  background: #090567;
}

.alt-step.active::before {
  border-right-color: #090567;
}

.alt-step.active::after {
  border-left-color: #090567;
}

@media (max-width: 768px) {
  .alt-steps {
  flex-wrap: wrap;
  }
}

.step:not(:last-child) {
   margin-right: 12px;
}

.step:not(:last-child)::after {
   content: "";
   position: absolute;
   top: 0;
   right: -18px;
   width: 0;
   height: 0;
   border-top: 18px solid transparent;
   border-bottom: 18px solid transparent;
   border-left: 18px solid #4b3b9a;
}

.step:first-child {
   border-radius: 24px 0 0 24px;
}

.step:last-child {
   border-radius: 0 24px 24px 0;
}

/* Sections */
.section {
   margin-top: 32px;
}

.section-header {
   display: flex;
   align-items: center;
   gap: 4px;
   margin-bottom: 14px;
}

.section-header h2 {
   font-size: 16px;
   margin: 0;
   font-weight: 600;
}

.chevron {
   font-weight: 700;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.section-header .chevron {
  transition: transform 0.25s;
}

.section-header.active .chevron {
  transform: rotate(90deg);
}

.section-divider {
  height: 1px;
  width: 100%;
  background: #5b8f74;
  opacity: 0.75;
  border-radius: 4px;
  margin: 4px 0 14px 0;
}

.section-body {
  display: none;
}

/* 3-column layout */
.fields-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px 24px; /* row gap, column gap */
  margin-top: 10px;
}

/* INLINE FIELD (Label & Input side-by-side) */
.field-inline {
  display: grid;
  grid-template-columns: 120px 1fr; /* label width | input width */
  align-items: center;
  gap: 10px;
}

/* Label Style */
.field-inline label {
  font-size: 13px;
  color: #444;
  font-weight: 500;
  white-space: nowrap;
}

/* Textbox style */
.field-inline input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid #bfbfbf;
  border-radius: 6px;
  background: #fafafa;
  font-size: 13px;
}

.field-inline input:focus {
  border-color: #4b3b9a;
  background: white;
  outline: none;
}

/* Address (textarea full width) */
.full-row {
  grid-column: 1 / 4;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.full-row label {
  font-size: 13px;
  font-weight: 500;
  color: #444;
}

.full-row textarea {
  padding: 10px;
  height: 90px;
  border: 1px solid #bfbfbf;
  border-radius: 6px;
  background: #fafafa;
  font-size: 13px;
  resize: none;
}

.full-row textarea:focus {
  border-color: #4b3b9a;
  background: #fff;
  outline: none;
}

/* Checkbox alignment */
.checkbox-inline {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.text box-input::placeholder {
  color: #bbb;
}

.inline-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Full-width text area row */
.full-row {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Big professional text areas */
.full-row textarea {
  width: 40%;
  padding: 10px 12px;
  height: 90px;
  border: 1px solid #b7b7b7;
  border-radius: 6px;
  background: #fafafa;
  resize: none;       /* prevents ugly resize */
  font-size: 13px;
  transition: 0.2s ease;
}

.full-row textarea:focus {
  outline: none;
  background: #fff;
  border-color: #4b3b9a;
}

.small-btn {
  border: none;
  padding: 2px 18px;
  font-size: 11px;
  border-radius: 12px;
  background: #f0f0ff;
  color: #4b3b9a;
  cursor: pointer;
}

.small-btn:hover {
  background: #e0ddff;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
}

.checkbox-row label {
  font-size: 12px;
  color: #444;
}

/* Save / Cancel Buttons */
.action-buttons {
  margin-top: 40px;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.save-btn {
  padding: 10px 28px;
  background: #4b3b9a;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

.cancel-btn {
  padding: 10px 26px;
  background: #bbb;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

@media (max-width: 768px) {
  .page-wrapper {
    margin: 0;
    border-radius: 0;
  }
  .steps {
    flex-wrap: wrap;
  }
  .step {
    margin-bottom: 8px;
  }
  }

/* POPUP OVERLAY */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.55);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99999;
}

/* POPUP BOX */
.modal-box {
  width: 780px;
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 12px;
  padding: 0;
  animation: fadeIn 0.25s ease;
  box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

/* HEADER */
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #4b3b9a;
  padding: 14px 20px;
  color: white;
  border-radius: 12px 12px 0 0;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}

.close-x {
  background: transparent;
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* BODY */
.modal-body {
  display: flex;
  gap: 20px;
  padding: 20px;
}

/* PHOTO */
.photo-section img {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #4b3b9a;
}

/* DETAILS */
.details-section {
  flex: 1;
  font-size: 14px;
}

.details-section h3 {
  font-size: 15px;
  font-weight: 600;
  color: #4b3b9a;
  margin: 16px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e5e5e5;
}

.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 26px;
  margin-bottom: 10px;
}

.details-grid p {
  margin: 0;
}

.details-grid strong {
  color: #111;
}

/* FOOTER */
.modal-footer {
  padding: 14px 20px;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background: #fafafa;
  border-radius: 0 0 12px 12px;
}

.modal-btn {
  padding: 8px 18px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.modal-btn.cancel {
  background: #ccc;
}

.modal-btn.submit {
  background: #4b3b9a;
  color: white;
}

/* SUCCESS POPUP OVERLAY */
.success-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.55);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999999;
}

/* SUCCESS CARD */
.success-box {
  background: white;
  padding: 30px 40px;
  border-radius: 12px;
  text-align: center;
  animation: scaleIn 0.25s ease-out;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

.success-icon {
  font-size: 48px;
  color: #1cab73;
  margin-bottom: 10px;
  animation: popIn 0.25s ease-out;
}

.success-box h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  color: #1cab73;
}

/* Animations */
@keyframes scaleIn {
  from { transform: scale(0.75); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

@keyframes popIn {
  from { transform: scale(0.4); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

</style>
</head>

<script>
    function calculateAge() {
  const dob = document.getElementById("dob").value;
  const ageField = document.getElementById("age");

  if (!dob) {
    ageField.value = "";
    return;
  }
  const birthDate = new Date(dob);
  const today = new Date();

  let age = today.getFullYear() - birthDate.getFullYear();
  const monthDiff = today.getMonth() - birthDate.getMonth();
  const dayDiff = today.getDate() - birthDate.getDate();

  // adjust age if birthday not reached this year
  if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
    age--;
  }
  ageField.value = age;
}

      row("Income", getVal('input[placeholder="Income"]')),

      row("Aadhaar", getVal('input[placeholder="Aadhaar Number"]')),

    ])}

    ${section("Demat Account")}
    ${grid([
      row("DP ID", getVal('input[placeholder="DP Id"]')),
      row("Client Code", getVal('input[placeholder="Client Code"]')),
      row("Scheme", getVal('input[placeholder="Scheme Name"]')),
      row("Broker", getVal('input[placeholder="Broker Name"]')),
      row("Nominee", getVal('input[placeholder="Nominee"]')),
      row("Nominee Contact", getVal('input[placeholder="Nominee Contact"]')),
      row("A/C Type", getVal('input[placeholder="A/C Type"]')),
    ])}

    ${section("Contact")}
    ${grid([
      row("Mobile", getVal("#mobileNumber")),
      row("WhatsApp", getVal("#whatsappPrimary")),
      row("Language", getVal('input[placeholder="Language"]')),
      row("Email", getVal('input[type="email"]')),
      row("Trade Code", getVal('input[placeholder="Trade Confirmation Code"]')),
      row("A/C Opening Date", getVal('input[type="date"]')),

    ])}

    ${section("Bank Details")}
    ${grid([
      row("Holder Name", getVal('input[placeholder="Holder Name"]')),
      row("Bank Name", getVal('input[placeholder="Bank Name"]')),
      row("Acc Number", getVal('input[placeholder="Acc Number"]')),
      row("IFSC", getVal('input[placeholder="IFSC"]')),
    ])}
  `;
  document.getElementById("previewDetails").innerHTML = html;
}

function showSuccessPopup() {
  const successBox = document.getElementById("successPopup");
  successBox.style.display = "flex";
  // auto close after 2 seconds (optional)
  setTimeout(() => {
    successBox.style.display = "none";
  }, 2000);
}

function submitProfile() {
  closePreview();      // close the big preview box
  showSuccessPopup();  // show the green success popup
}

function buildFamilyAccounts() {
  let html = "";
  document.querySelectorAll("#familyAccounts input").forEach(i => {
    if (i.value.trim()) html += `<li>${i.value}</li>`;
  });
  return html || "<li>No Family Accounts Added</li>";
}

function section(title) {
  return `<h3>${title}</h3>`;
}

function grid(rows) {
  return `<div class="details-grid">${rows.join("")}</div>`;
}

function row(label, value) {
  return `<p><strong>${label}:</strong> ${value || "-"}</p>`;
}

function getVal(selector) {
  const el = document.querySelector(selector);
  return el ? el.value : "";
}

function closePreview() {
  document.getElementById("previewModal").style.display = "none";
}


function addFamilyAccount() {
  const container = document.getElementById("familyAccounts");

  const wrapper = document.createElement("div");
  wrapper.className = "field";
  wrapper.style.marginTop = "8px";
  wrapper.style.maxWidth = "320px";
  wrapper.innerHTML = `
  <label>Family A/C</label>
  <div class="inline-row">
      <input class="underline-input" type="text" placeholder="Family A/C number" />
      <button type="button" class="small-btn" onclick="this.parentNode.parentNode.remove()">Cancel</button>
  </div>
 `;

container.appendChild(wrapper);
}

}

function copyMobileToWhatsapp() {
  const mobile = document.getElementById("mobileNumber").value;
  const waPrimary = document.getElementById("whatsappPrimary");

  if (document.getElementById("whatsappSame").checked) {
    waPrimary.value = mobile;
  } else {
    waPrimary.value = "";
  }
}


function copyCommToPermanent() {
  const comm = document.getElementById("commAddress").value;
  const perm = document.getElementById("permAddress");

  if (document.getElementById("permSame").checked) {
    perm.value = comm;
  } else {
    perm.value = "";
  }
}

function copyPermanentToBilling() {
  const perm = document.getElementById("permAddress").value;
  const bill = document.getElementById("billingAddress");

  if (document.getElementById("billingSame").checked) {
    bill.value = perm;
  } else {
    bill.value = "";
  }
}

function chooseProfileImage() {
  document.getElementById("profileInput").click();
}

document.getElementById("profileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (file) {
    document.getElementById("profilePreview").src = URL.createObjectURL(file);
    document.getElementById("profileIcon").style.display = "none";
  }
});

function removeProfileImage() {
  document.getElementById("profilePreview").src = "";
  document.getElementById("profileIcon").style.display = "block";
}

function saveProfileImage() {
  alert("Profile image saved!");
}

function openAccordion(sectionId, headerEl) {
  const allBodies = document.querySelectorAll(".section-body");
  const allHeaders = document.querySelectorAll(".section-header");

  // Hide all sections
  allBodies.forEach(body => (body.style.display = "none"));
  allHeaders.forEach(h => h.classList.remove("active"));

  // Open clicked section
  const currentSection = document.getElementById(sectionId);
  currentSection.style.display = "block";
  headerEl.classList.add("active");
}

function toggleSection(id, header) {
  const body = document.getElementById(id);
  body.style.display = (body.style.display === "none" || body.style.display === "") 
    ? "block" 
    : "none";

  header.classList.toggle("active");
}
